name: Cliprausch first-time setup
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'install files, initialize separate state once, or check connection without posting'
        type: choice
        options: [install, initialize, check]
        default: install
permissions:
  contents: write
concurrency:
  group: cliprausch-production-state
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the reviewed standalone files
        if: ${{ inputs.mode == 'install' }}
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          if Path('scripts/cliprausch/cli.py').exists():
              raise SystemExit('Already installed. Edit the live files; do not overwrite later fixes with the initial payload.')
          files=json.loads(Path('setup_payload.json').read_text())
          for name,content in files.items():
              path=Path(name)
              if path.is_absolute() or '..' in path.parts or path.parts[0] in ('.git','.github'):
                  raise SystemExit('invalid path')
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content,encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*files],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              subprocess.run(['git','commit','-m','Install isolated Cliprausch workflow modules and tests'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
          python -m unittest discover -s tests_cliprausch -v
          python -m scripts.cliprausch.cli plan
      - name: Initialize only the new account state
        if: ${{ inputs.mode == 'initialize' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.upload_transport import GitHubAPI,ServiceError,GITHUB_URL
          api=GitHubAPI(os.environ.pop('GH_TOKEN'))
          if GITHUB_URL!='https://api.github.com/repos/renej11-coder/cliprausch':raise SystemExit('wrong repository')
          try:
              api.call('GET','/git/ref/heads/cliprausch-state')
              raise SystemExit('State already exists; never reset it.')
          except ServiceError as e:
              if str(e)!='github_http_404':raise
          state={'version':1,'account':'cliprauschxl','channel_id':'6ade2a5a2f1f5ed648ca90cf','queue':[],'attempts':[]}
          tree=api.call('POST','/git/trees',{'tree':[{'path':'state.json','mode':'100644','type':'blob','content':json.dumps(state,indent=2)}]})
          commit=api.call('POST','/git/commits',{'message':'Initialize separate Cliprausch state once','tree':tree['sha'],'parents':[]})
          api.call('POST','/git/refs',{'ref':'refs/heads/cliprausch-state','sha':commit['sha']})
          print('Initialized separate state; no TikTok post sent.')
          PY
      - name: Read-only Buffer connection check
        if: ${{ inputs.mode == 'check' }}
        env:
          CLIPRAUSCH_BUFFER_API_KEY: ${{ secrets.CLIPRAUSCH_BUFFER_API_KEY }}
        run: python -m scripts.cliprausch.cli check
