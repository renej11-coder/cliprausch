name: Cliprausch – independent Twitch clips

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: connection only; prepare: review candidate; review: approve receipt; publish: due slot only'
        type: choice
        options: [plan, check, discover, prepare, review, approve, publish, publish-now, publish-test, ranking, subtitle-check]
        default: check
      review_json:
        description: 'Exact clip_id and review receipt after watching final media; no post sent by review'
        type: string
        required: false
      artifact_run_id:
        description: 'approve only: run ID containing the watched review artifact'
        type: string
        required: false
  pull_request:
    paths: ['scripts/cliprausch/**', 'tests_cliprausch/**', '.github/workflows/cliprausch.yml', 'requirements-cliprausch.txt']
  push:
    paths: ['scripts/cliprausch/**', 'tests_cliprausch/**', '.github/workflows/cliprausch.yml', 'requirements-cliprausch.txt']
  schedule:
    - cron: '19,39,59 * * * *'

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name != 'schedule' || vars.CLIPRAUSCH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests_cliprausch -v
          python -m scripts.cliprausch.cli plan

  connection:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify only the new Buffer connection without creating a post
        env:
          CLIPRAUSCH_BUFFER_API_KEY: ${{ secrets.CLIPRAUSCH_BUFFER_API_KEY }}
        run: python -m scripts.cliprausch.cli check

  run:
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish' && inputs.mode != 'publish-now' && inputs.mode != 'publish-test') || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && vars.CLIPRAUSCH_ENABLED == 'true') }}
    concurrency:
      group: cliprausch-production-state
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Decide whether scheduled candidate preparation is due
        id: production
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.cliprausch.cli production-plan
      - name: Prepare media tools without Buffer credentials
        if: ${{ inputs.mode == 'subtitle-check' || inputs.mode == 'prepare' || inputs.mode == 'discover' || steps.production.outputs.needed == 'true' }}
        timeout-minutes: 12
        run: |
          python -m pip install -r requirements-cliprausch.txt
          python -m pip check
          if ! command -v ffmpeg >/dev/null || ! command -v tesseract >/dev/null || ! test -f /usr/share/tesseract-ocr/5/tessdata/deu.traineddata || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            # Bypass the intermittent Azure package mirror; use official Ubuntu mirrors.
            sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
            printf '%s\n' 'deb https://archive.ubuntu.com/ubuntu noble main universe restricted multiverse' 'deb https://archive.ubuntu.com/ubuntu noble-updates main universe restricted multiverse' 'deb https://security.ubuntu.com/ubuntu noble-security main universe restricted multiverse' | sudo tee /etc/apt/sources.list.d/cliprausch.list >/dev/null
            sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 install --no-install-recommends -y ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          fi
      - name: Read-only plan
        if: ${{ inputs.mode == 'plan' }}
        run: python -m scripts.cliprausch.cli plan
      - name: Check new Buffer account without publishing
        if: ${{ inputs.mode == 'check' }}
        env:
          CLIPRAUSCH_BUFFER_API_KEY: ${{ secrets.CLIPRAUSCH_BUFFER_API_KEY }}
        run: python -m scripts.cliprausch.cli check
      - name: Refresh official Twitch live ranking
        if: ${{ inputs.mode == 'ranking' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPRAUSCH_TWITCH_CLIENT_ID: ${{ secrets.CLIPRAUSCH_TWITCH_CLIENT_ID }}
          CLIPRAUSCH_TWITCH_CLIENT_SECRET: ${{ secrets.CLIPRAUSCH_TWITCH_CLIENT_SECRET }}
        run: python -m scripts.cliprausch.cli ranking
      - name: Discover or render one review candidate
        if: ${{ inputs.mode == 'prepare' || inputs.mode == 'discover' || steps.production.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPRAUSCH_TWITCH_CLIENT_ID: ${{ secrets.CLIPRAUSCH_TWITCH_CLIENT_ID }}
          CLIPRAUSCH_TWITCH_CLIENT_SECRET: ${{ secrets.CLIPRAUSCH_TWITCH_CLIENT_SECRET }}
          MODE: ${{ inputs.mode == 'discover' && 'discover' || 'prepare' }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: python -m scripts.cliprausch.cli "$MODE"
      - name: Download the original regression artifact
        if: ${{ inputs.mode == 'subtitle-check' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cliprausch-review-${{ inputs.artifact_run_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: .review-download
      - name: Verify the known duplicate-subtitle source without publishing
        if: ${{ inputs.mode == 'subtitle-check' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.cliprausch.cli subtitle-check
      - name: Save review media for seven days
        if: ${{ inputs.mode == 'subtitle-check' || inputs.mode == 'prepare' || steps.production.outputs.needed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cliprausch-review-${{ github.run_id }}
          path: |
            rendered-cliprausch/**/final.mp4
            rendered-cliprausch/**/transcript.json
            rendered-cliprausch/**/qa.json
            rendered-cliprausch/**/subtitle-scan.json
            rendered-cliprausch/**/candidate.json
            rendered-cliprausch/**/contact-sheet.jpg
            rendered-cliprausch/**/render-error.json
            rendered-cliprausch/**/diagnostic.json
          retention-days: 7
          if-no-files-found: warn
      - name: Apply reviewed receipt without Buffer access
        if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPRAUSCH_REVIEW_JSON: ${{ inputs.review_json }}
        run: python -m scripts.cliprausch.cli review
      - name: Download the explicitly reviewed artifact
        if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'approve' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cliprausch-review-${{ inputs.artifact_run_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: .review-download
      - name: Host reviewed immutable media and save receipt
        if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'approve' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPRAUSCH_REVIEW_JSON: ${{ inputs.review_json }}
        run: python -m scripts.cliprausch.cli approve

  publish:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.mode == 'publish' || inputs.mode == 'publish-now' || inputs.mode == 'publish-test') }}
    concurrency:
      group: cliprausch-production-state
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select automatic media without Buffer access
        id: automatic
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: python -m scripts.cliprausch.automatic plan
      - name: Download rendered media for automatic checks
        if: ${{ steps.automatic.outputs.needed == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cliprausch-review-${{ steps.automatic.outputs.artifact_run_id }}
          run-id: ${{ steps.automatic.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: .review-download
      - name: Validate and host automatically without Buffer access
        if: ${{ steps.automatic.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.cliprausch.automatic host
      - name: Publish or reconcile independently of candidate preparation failures
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPRAUSCH_BUFFER_API_KEY: ${{ secrets.CLIPRAUSCH_BUFFER_API_KEY }}
          CLIPRAUSCH_ENABLED: ${{ vars.CLIPRAUSCH_ENABLED }}
          MODE: ${{ inputs.mode == 'publish-test' && 'publish-test' || inputs.mode == 'publish-now' && 'publish-now' || 'publish' }}
        run: python -m scripts.cliprausch.cli "$MODE"
